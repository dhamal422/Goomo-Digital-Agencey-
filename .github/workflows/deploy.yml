name: Deploy Vite Website to Subdomain

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: 🎉 Build and Deploy to Subdomain
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🛠️ Build Project
      run: npm run build

    - name: 🚀 Sync files to Subdomain via Native lftp
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        lftp -e "set ftp:passive-mode true; set ftp:ssl-allow false; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' -p 21 ${{ secrets.FTP_SERVER }}; mirror -R ./dist/ ./; quit"
