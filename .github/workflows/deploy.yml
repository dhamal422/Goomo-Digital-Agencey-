name: Deploy Vite Website to Subdomain

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: 🎉 Build and Deploy to Subdomain
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🛠️ Build Project
      run: npm run build

    - name: 🚀 Sync dist folder via Node Script
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        npm install vinyl-ftp fancy-log
        node -e "
        const ftp = require('vinyl-ftp');
        const log = require('fancy-log');
        const conn = new ftp({
          host: process.env.FTP_SERVER,
          user: process.env.FTP_USERNAME,
          password: process.env.FTP_PASSWORD,
          port: 21,
          parallel: 5,
          log: log
        });
        const fs = require('fs');
        const path = require('path');
        function uploadDir(localPath, remotePath) {
          const files = fs.readdirSync(localPath);
          files.forEach(file => {
            const curPath = path.join(localPath, file);
            const remPath = path.join(remotePath, file);
            if (fs.lstatSync(curPath).isDirectory()) {
              conn.mkdir(remPath, true, () => uploadDir(curPath, remPath));
            } else {
              fs.createReadStream(curPath).pipe(conn.dest(remotePath));
            }
          });
        }
        uploadDir('./dist', '/');
        "
