name: Deploy Vite Website to Subdomain

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: 🎉 Build and Deploy to Subdomain
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🛠️ Build Project
      run: npm run build

    - name: 🚀 Sync files to Subdomain via FTP
      uses: SebRollen/file-deployer@v0.0.9
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./dist/
        remote-dir: ./
